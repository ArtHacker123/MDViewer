<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'self'">
  <title>Markdown 查看器</title>
  <link rel="stylesheet" href="../../vendor/github-markdown.css">
  <link rel="stylesheet" href="../../vendor/hljs.css">
  <link rel="stylesheet" href="../../vendor/katex.min.css">
  <link rel="stylesheet" href="../shared/mdv.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body class="mdv-viewer">
  <header class="mdv-toolbar">
    <div class="mdv-brand">
      <img src="../../icons/icon32.png" alt="" width="20" height="20">
      <span>Markdown 查看器</span>
    </div>
    <div class="mdv-actions">
      <button type="button" class="mdv-btn" id="openFileBtn">打开文件</button>
      <form class="mdv-url-form" id="urlForm">
        <input type="text" id="urlInput" placeholder="粘贴 Markdown 文件 URL" spellcheck="false" autocomplete="off">
        <button type="submit" class="mdv-btn">打开链接</button>
      </form>
      <button type="button" class="mdv-btn" id="tocBtn" aria-pressed="false">目录</button>
      <button type="button" class="mdv-btn" id="rawBtn" aria-pressed="false">源码</button>
      <button type="button" class="mdv-btn" id="printBtn">打印</button>
    </div>
  </header>

  <main class="mdv-viewer-main">
    <section class="mdv-empty" id="empty">
      <div class="mdv-dropzone" id="dropzone">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path fill="currentColor" d="M14.85 3H1.15C.52 3 0 3.52 0 4.15v7.7C0 12.48.52 13 1.15 13h13.7c.63 0 1.15-.52 1.15-1.15v-7.7C16 3.52 15.48 3 14.85 3zM9 11H7V7.5L5.5 9.5 4 7.5V11H2V5h2l1.5 2L7 5h2v6zm4.5-3h-1.5v3h-2V8H8.5V6h1.5V3h2v3h1.5v2z"/>
        </svg>
        <h1>拖放 Markdown 文件到这里</h1>
        <p>支持 .md / .markdown / .mdown / .mkd，也可以点击下方按钮选择文件，或在顶部输入远程文件 URL。</p>
        <button type="button" class="mdv-btn mdv-btn-primary" id="pickBtn">选择文件</button>
      </div>
    </section>

    <div class="mdv-viewer-content" id="content" hidden>
      <article class="mdv-markdown" id="article"></article>
      <pre class="mdv-raw" id="raw" hidden></pre>
    </div>

    <aside class="mdv-toc" id="toc" hidden></aside>
  </main>

  <input type="file" id="fileInput" accept=".md,.markdown,.mdown,.mkd,text/markdown,text/plain" hidden>

  <script src="../../vendor/marked.umd.js"></script>
  <script src="../../vendor/highlight.min.js"></script>
  <script src="../../vendor/purify.min.js"></script>
  <script src="../../vendor/katex.min.js"></script>
  <script src="../../vendor/mermaid.min.js"></script>
  <script src="../shared/render.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
